schema = 1

id = "kita/fastfetch"
version = "2.64.2"
summary = "快速、可定制的系统信息工具"
description = "Fastfetch 官方 Windows x86_64 发行版，重新打包为 portable zip，用于演示真实软件的本地安装。"
license = "MIT"
homepage = "https://github.com/fastfetch-cli/fastfetch"
upstream = "https://github.com/fastfetch-cli/fastfetch/releases"

[platform]
os = "windows"
arch = ["x86_64"]

[install]
mode = "portable"
strip_components = 0

[capabilities]
elevation = "never"

[[artifact]]
target = "x86_64-pc-windows-msvc"
url = "blobs/fastfetch-2.64.2-windows-amd64.zip"
sha256 = "2b6a036c2eaec2403c8bbdfefdb0b8ce21683a5f525c93cb6d566a4a7d4b2952"
size = 5444644
format = "zip"

[[bin]]
name = "fastfetch"
path = "fastfetch.exe"
kind = "console"

[[bin]]
name = "flashfetch"
path = "flashfetch.exe"
kind = "console"
